name: CI

# SUNIL M1 — T21 minimal CI (docs/M1_BUILD_PLAN.md §5 T21).
# Gates every merge (docs/GIT_WORKFLOW.md rule 4): backend ruff+pytest,
# frontend typecheck+build, security import-boundary + critical tests.
#
# Runs on GitHub-hosted `ubuntu-latest` runners (Linux). This is a DIFFERENT
# environment from the Windows build machine: on Linux runners `python3` is
# the normal interpreter, but this workflow deliberately calls `python`
# everywhere anyway, so the exact same commands in docs/CI.md work
# unchanged on the Windows dev machine, where `python3` is a broken
# Microsoft Store stub (docs/ENVIRONMENT.md §1). `python` resolves correctly
# on both because `actions/setup-python` puts a `python` shim on PATH on
# every OS it supports.
#
# No secrets are read from GitHub Actions secrets anywhere in this file.
# The env block below supplies only obviously-fake literal placeholder
# values so Settings() / create_app() can construct in a suite that hasn't
# monkeypatched them itself — never a real credential (ET-10). Any test
# needing a real credential is `@pytest.mark.live` and deselected here via
# `-m "not live"` (docs/M1_BUILD_PLAN.md §5 T21).

on:
  push:
  pull_request:

# Fake, non-secret placeholder values only — never real credentials.
# Required so any code path that constructs `sunil.settings.Settings()`
# (e.g. importing `sunil.main`) can do so even in a test process that
# hasn't monkeypatched its own environment. Mirrors
# apps/api/tests/unit/test_settings.py's fixture values.
env:
  ANTHROPIC_API_KEY: sk-ant-fake-ci-value
  GITHUB_TOKEN: github_pat_fake-ci-value
  SESSION_SECRET: fake-ci-session-secret-value
  OWNER_USERNAME: ci-owner
  OWNER_PASSWORD: fake-ci-owner-password
  DATABASE_URL: sqlite+aiosqlite:///./var/sunil-ci.db
  WEB_ORIGIN: http://localhost:3000
  SUNIL_CONFIG_DIR: ./config

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install sunil-api (editable, dev extras)
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: python -m ruff check .

      - name: ruff format --check
        run: python -m ruff format --check .

      - name: pytest -q
        # pytest exits 5 when it collects zero tests — a silent pass if a
        # job only checks for a nonzero/exit-1 failure. T1 shipped
        # test_settings.py so this should never be hit for real, but the
        # job still treats 5 as a failure explicitly rather than by
        # accident (docs/M1_BUILD_PLAN.md §11 trap 11).
        run: |
          set +e
          python -m pytest -q -m "not live"
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::error::pytest collected zero tests (exit code 5). Empty is not green — treating as a failure. See docs/CI.md."
            exit 1
          fi
          exit "$code"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # T14 (apps/web) lands in parallel on task/T14-web-scaffold. Until it
      # merges, apps/web/package.json does not exist on main — this job
      # must skip cleanly, not fail red, in that case. Checked as a step
      # (after checkout) rather than via a job-level `if: hashFiles(...)`,
      # because a job-level `if` is evaluated before any step — including
      # checkout — runs, so it cannot see repository files reliably.
      - name: Check apps/web is present
        id: web
        run: |
          if [ -f "apps/web/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/web/package.json not found (T14 has not merged yet) — frontend job skips cleanly."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.web.outputs.present == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.web.outputs.present == 'true'
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: pnpm install --frozen-lockfile
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: pnpm typecheck

      - name: pnpm build
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: pnpm build

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      # T19 owns apps/api/tests/security (the DC-10 import-boundary tests
      # and the critical security tests). Until it merges, that directory
      # does not exist — this job must skip cleanly, not fail red.
      - name: Check apps/api/tests/security is present
        id: sec
        run: |
          if [ -d "tests/security" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/api/tests/security not found (T19 has not merged yet) — security job skips cleanly."
          fi

      - name: Install sunil-api (editable, dev extras)
        if: steps.sec.outputs.present == 'true'
        run: python -m pip install -e ".[dev]"

      - name: pytest tests/security -q
        if: steps.sec.outputs.present == 'true'
        # Same exit-5 trap as the backend job, applied here too — an empty
        # security suite must not report green.
        run: |
          set +e
          python -m pytest tests/security -q -m "not live"
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::error::security suite collected zero tests (exit code 5). Empty is not green — treating as a failure."
            exit 1
          fi
          exit "$code"
