# SUNIL V2 — continuous integration
# =========================================================================
# Fresh, minimal CI for a repository that is currently docs + platform only.
# Branch `V2` is a clean-slate rebuild: there is no application code to build
# or test yet (ADR-030 Amendment 1). This workflow therefore validates what
# actually exists, and is written so that jobs light up automatically as the
# six parallel streams land code — without needing a rewrite each time.
#
# Two rules inherited from the V1 workflow (docs/CI.md) and kept deliberately,
# because `codely-isuru/SUNIL` is a PUBLIC repository and every run log is
# world-readable:
#   1. No `secrets.*` reference anywhere in this file. A job that holds a real
#      credential and echoes a variable publishes it to the internet.
#   2. Workflow-level `permissions: contents: read`. Nothing here writes to
#      the repo, comments on a PR, or touches packages — so that guarantee
#      lives in this reviewed file, not only in a settings page an admin
#      could flip later.
# =========================================================================
name: CI

on:
  push:
    branches: [main, V2, 'task/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # (a) The platform definition must be structurally valid, resolve its
  #     variables, and contain no credentials.
  # -----------------------------------------------------------------------
  platform:
    name: Platform (compose validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show Docker Compose version
        run: docker compose version

      # The literal check named in the Phase 0 task. Passes with no .env
      # present: secrets are declared as ${VAR} with no default, so an unset
      # value resolves to an empty string with a warning — the file still
      # validates, but a container started that way fails loudly rather than
      # running a guessable secret.
      - name: Validate compose file (no .env)
        run: docker compose -f infra/docker-compose.yml config --quiet

      # The stronger assertion: .env.example must actually satisfy every
      # variable the compose file interpolates. This is what catches a new
      # variable added to Compose but forgotten in the template — the failure
      # mode that otherwise surfaces as a broken `dev-up` on someone's
      # machine three days later.
      - name: Validate compose file against .env.example
        run: |
          docker compose --env-file .env.example \
            -f infra/docker-compose.yml config > /tmp/resolved.yml
          echo "Resolved services:"
          docker compose --env-file .env.example \
            -f infra/docker-compose.yml config --services

      - name: Assert no unresolved variables remain
        run: |
          if grep -nE '\$\{[A-Z0-9_]+' /tmp/resolved.yml; then
            echo "::error::Unresolved variable(s) in the resolved compose output."
            exit 1
          fi
          echo "OK: every interpolation resolved."

      - name: Assert every service pins an image digest-or-version (no :latest)
        run: |
          # A floating tag makes the platform irreproducible and is the
          # classic cause of "it worked yesterday". ADR-030 Consequences
          # requires third-party dependencies to be pinned.
          bad=0
          images=$(grep -oE '^\s+image: .*' /tmp/resolved.yml | awk '{print $2}')
          echo "$images"
          for img in $images; do
            case "$img" in
              *:latest|*:stable|*:main|*:next|*:beta)
                echo "::error::Floating tag not allowed: $img"; bad=1 ;;
              *:*) ;;
              *) echo "::error::Unpinned image (no tag): $img"; bad=1 ;;
            esac
          done
          exit $bad

      - name: Assert required ports are not reserved elsewhere
        run: |
          # 4317 is the Minions Portal on the team's build machine and must
          # never be bound by this stack (docs/ENVIRONMENT.md §7).
          if grep -nE 'published: "?4317"?' /tmp/resolved.yml; then
            echo "::error::Port 4317 is reserved for the Minions Portal."
            exit 1
          fi
          echo "OK: 4317 not bound."

      - name: Scan tracked files for credential-shaped strings
        run: |
          # Cheap guard, not a replacement for secret scanning: catches the
          # specific mistake of pasting a working key into a config or a
          # template. Dummy values in .env.example are constructed to not
          # match (they carry an explicit `dummy`/`change-me` marker).
          #
          # Real Anthropic keys are sk-ant-api..., real OpenAI keys are
          # sk-<40+ chars>. Match those shapes, then drop anything that
          # self-identifies as a placeholder.
          set +e
          hits=$(git grep -nIE \
            -e 'sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}' \
            -e 'sk-(proj-)?[A-Za-z0-9]{40,}' \
            -e 'ghp_[A-Za-z0-9]{36}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e '-----BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY-----' \
            -- . ':!.github/workflows/ci.yml' \
            | grep -viE 'dummy|change-me|example|placeholder|not-a-real')
          set -e
          if [ -n "$hits" ]; then
            echo "::error::Possible credential committed:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no credential-shaped strings in tracked files."

      - name: Lint platform YAML
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint.yml infra/ .github/workflows/

      - name: Shell-check the POSIX scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning \
            scripts/dev-up.sh scripts/dev-down.sh \
            infra/postgres/init/*.sh

      - name: Assert executable scripts are ASCII-only
        run: |
          # This is not style policing - it is a real bug class, found the hard
          # way while building this platform.
          #
          # Windows PowerShell 5.1 (the default shell on the team's build
          # machine) decodes a BOM-less file as cp1252, not UTF-8. An em dash
          # (U+2014 = E2 80 94) therefore decodes as three cp1252 characters,
          # the last of which is 0x94 = a RIGHT DOUBLE QUOTATION MARK - which
          # PowerShell treats as a string delimiter. One em dash inside a
          # comment or string silently terminates that string and the script
          # fails to PARSE. It cost a real debugging cycle here.
          #
          # The pwsh step below cannot catch this: PowerShell 7 on Linux reads
          # UTF-8 correctly and parses the file happily. Only this byte-level
          # check catches it on a Linux runner, which is why both steps exist.
          # Done in Python, not `grep -P`: grep's PCRE support is optional and
          # locale-dependent, and when it bails out it returns 2 - which an
          # `if grep -q ...` guard reads as "no match", silently passing. This
          # check must not be able to fail open.
          python - <<'PY'
          import glob, sys

          patterns = ["scripts/*.ps1", "scripts/*.sh", "infra/postgres/init/*.sh"]
          files = sorted({f for p in patterns for f in glob.glob(p)})
          if not files:
              print("::error::ASCII guard matched no files - check the patterns.")
              sys.exit(1)

          failed = False
          for path in files:
              data = open(path, "rb").read()
              bad = [(i, b) for i, b in enumerate(data) if b > 0x7F]
              if bad:
                  failed = True
                  line = data[: bad[0][0]].count(b"\n") + 1
                  print(f"::error file={path},line={line}::"
                        f"{len(bad)} non-ASCII byte(s), first 0x{bad[0][1]:02x} on line {line}")
              else:
                  print(f"OK: {path}")
          sys.exit(1 if failed else 0)
          PY

      - name: Parse-check the PowerShell scripts
        shell: pwsh
        run: |
          # Catches structural syntax errors without executing anything.
          # Caveat: this runs PowerShell 7, so it does NOT catch constructs
          # that parse in 7 but not in Windows PowerShell 5.1 (`??`, `?:`,
          # ternaries). Those are guarded by review plus the ASCII check above;
          # see docs/tasks/P0-platform.md for the known gap.
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  Write-Host "::error::Parse errors in $($_.Name)"
                  $errors | ForEach-Object { Write-Host "  $($_.Message)" }
                  $failed = $true
              } else {
                  Write-Host "OK: $($_.Name)"
              }
          }
          if ($failed) { exit 1 }

  # -----------------------------------------------------------------------
  # (b) Contract linting. Phase 0 freezes five seams (C1–C5) and C4 is an
  #     OpenAPI document. None of them exist on this branch yet, so this job
  #     must SKIP CLEANLY rather than fail — and must start enforcing the
  #     moment the first contract lands, with no edit to this file.
  # -----------------------------------------------------------------------
  contracts:
    name: Contracts (YAML / OpenAPI lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect contract files
        id: detect
        run: |
          shopt -s nullglob
          files=(docs/contracts/*.yaml docs/contracts/*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No files matching docs/contracts/*.y{a,}ml yet."
            echo "Phase 0 will add C1-C5; this job starts enforcing automatically."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            printf 'Found %d contract file(s):\n' "${#files[@]}"
            printf '  %s\n' "${files[@]}"
            printf '%s\n' "${files[@]}" > /tmp/contract-files.txt
          fi

      - name: YAML lint
        if: steps.detect.outputs.found == 'true'
        run: |
          pip install --quiet yamllint
          xargs -a /tmp/contract-files.txt yamllint -c .yamllint.yml

      - name: OpenAPI validate
        if: steps.detect.outputs.found == 'true'
        run: |
          pip install --quiet openapi-spec-validator
          # Only files that declare themselves as OpenAPI get schema-validated;
          # a plain-YAML contract (e.g. C1's tool-adapter shape) is linted by
          # the step above and skipped here.
          checked=0
          while read -r f; do
            if grep -qE '^openapi:' "$f"; then
              echo "--> validating $f"
              python -m openapi_spec_validator "$f"
              checked=$((checked + 1))
            else
              echo "--> $f has no 'openapi:' key, YAML-lint only"
            fi
          done < /tmp/contract-files.txt
          echo "OpenAPI documents validated: $checked"

      - name: Summary
        run: |
          if [ "${{ steps.detect.outputs.found }}" = 'true' ]; then
            echo "Contracts linted."
          else
            echo "No contracts present — job passed without assertions."
          fi

  # -----------------------------------------------------------------------
  # (c) Test job. A placeholder that passes today and becomes the real suite
  #     when application code arrives. It is wired as a real job (not a
  #     no-op) so that branch protection can require it from day one and the
  #     requirement does not have to be added later, when it is easy to
  #     forget.
  # -----------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect a Python test suite
        id: detect
        run: |
          # `apps/api` is where the rebuilt backend will live (ADR-011).
          if [ -f apps/api/pyproject.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.detect.outputs.found == 'true'
        with:
          python-version: '3.13'

      - name: Install and run backend tests
        if: steps.detect.outputs.found == 'true'
        working-directory: apps/api
        run: |
          # NOTE: `python`, never `python3` — the team's Windows build machine
          # has a broken python3 Store stub (docs/ENVIRONMENT.md §1), and the
          # commands here are meant to be typed identically in both places.
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q -m "not live"

      - name: Placeholder (no application code on this branch yet)
        if: steps.detect.outputs.found != 'true'
        run: |
          echo "Branch V2 is a clean-slate rebuild: no application code yet"
          echo "(ADR-030 Amendment 1)."
          echo "This job passes deliberately and will run the real suite as"
          echo "soon as apps/api/pyproject.toml exists."
          exit 0
