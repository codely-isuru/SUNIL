<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.U.N.I.L — Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#22d3ee;
    --cyan-dim:rgba(34,211,238,.55);
    --cyan-faint:rgba(34,211,238,.18);
    --bg:#030712;
    --panel:rgba(7,16,32,.72);
    --amber:#fbbf24;
    --ok:#34d399;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:'Share Tech Mono',ui-monospace,monospace;color:var(--cyan);position:relative}
  canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,5,.75) 100%)}
  .scanlines{position:absolute;inset:0;pointer-events:none;opacity:.05;
    background:repeating-linear-gradient(0deg,transparent 0 2px,#67e8f9 2px 3px)}

  .hud{position:absolute;inset:0;pointer-events:none;display:grid;
    grid-template-columns:300px 1fr 300px;grid-template-rows:auto 1fr auto;
    padding:26px;gap:18px}
  .hud > *{pointer-events:auto}

  .title-block{grid-column:1;grid-row:1}
  h1{font-family:'Orbitron',sans-serif;font-weight:800;font-size:34px;letter-spacing:8px;
    text-shadow:0 0 18px var(--cyan-dim)}
  .subtitle{font-size:11px;letter-spacing:3px;color:var(--cyan-dim);margin-top:6px;text-transform:uppercase}
  .datestamp{font-size:12px;color:var(--cyan-dim);margin-top:10px}

  .clock-block{grid-column:3;grid-row:1;text-align:right}
  .clock{font-family:'Orbitron',sans-serif;font-size:30px;font-weight:600;
    text-shadow:0 0 14px var(--cyan-dim)}
  .clock small{font-size:12px;letter-spacing:2px;color:var(--cyan-dim);display:block;margin-top:6px}

  .panel{background:var(--panel);border:1px solid var(--cyan-faint);border-radius:6px;
    padding:14px 16px;backdrop-filter:blur(3px);position:relative}
  .panel::before{content:"";position:absolute;top:-1px;left:12px;width:46px;height:2px;
    background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .panel h2{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:600;letter-spacing:3px;
    color:#7dd3fc;margin-bottom:12px;text-transform:uppercase}

  .left-col{grid-column:1;grid-row:2;align-self:center;display:flex;flex-direction:column;gap:16px}
  .right-col{grid-column:3;grid-row:2;align-self:center;display:flex;flex-direction:column;gap:16px}

  .sysrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;
    padding:5px 0;border-bottom:1px dashed rgba(34,211,238,.12)}
  .sysrow:last-child{border-bottom:none}
  .lamp{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:1px}
  .lamp.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .lamp.off{background:#475569}
  .lamp.warn{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .sysrow .state{font-size:10px;letter-spacing:2px;color:var(--cyan-dim)}

  .queue-item{font-size:12px;padding:7px 0;border-bottom:1px dashed rgba(34,211,238,.12);line-height:1.5}
  .queue-item:last-child{border-bottom:none}
  .queue-item .when{color:var(--amber);font-size:10px;letter-spacing:1px;display:block}

  .bottom-bar{grid-column:1/4;grid-row:3;display:flex;gap:16px;align-items:stretch;justify-content:center}
  .stat{background:var(--panel);border:1px solid var(--cyan-faint);border-radius:6px;
    padding:12px 22px;text-align:center;min-width:150px}
  .stat .val{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:600;
    text-shadow:0 0 12px var(--cyan-dim)}
  .stat .lbl{font-size:10px;letter-spacing:2px;color:var(--cyan-dim);margin-top:5px;text-transform:uppercase}
  .stat .delta{font-size:10px;margin-top:3px}
  .delta.up{color:var(--ok)} .delta.down{color:#f87171}

  #briefBtn{font-family:'Orbitron',sans-serif;letter-spacing:4px;font-size:13px;font-weight:600;
    color:var(--cyan);background:rgba(34,211,238,.08);border:1px solid var(--cyan-dim);
    border-radius:6px;padding:0 34px;cursor:pointer;transition:all .25s;text-transform:uppercase}
  #briefBtn:hover{background:rgba(34,211,238,.2);box-shadow:0 0 22px var(--cyan-faint)}
  #briefBtn.speaking{background:rgba(34,211,238,.28);box-shadow:0 0 30px var(--cyan-dim);
    animation:btnpulse 1.1s ease-in-out infinite}
  @keyframes btnpulse{50%{box-shadow:0 0 44px var(--cyan-dim)}}

  .greeting{grid-column:2;grid-row:1;justify-self:center;text-align:center;font-size:13px;
    letter-spacing:2px;color:#a5f3fc;text-shadow:0 0 10px var(--cyan-faint);padding-top:4px}

  @media (max-width:960px){
    .hud{grid-template-columns:1fr;grid-template-rows:auto auto auto auto auto;overflow-y:auto}
    .title-block,.clock-block,.left-col,.right-col,.bottom-bar,.greeting{grid-column:1}
    .clock-block{text-align:left;grid-row:2}
    .greeting{grid-row:3}.left-col{grid-row:4}.right-col{grid-row:5}
    .bottom-bar{grid-row:6;flex-wrap:wrap}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="hud">
  <div class="title-block">
    <h1>S.U.N.I.L</h1>
    <div class="subtitle">Systems Utility &amp; Neural Intelligence Liaison</div>
    <div class="datestamp" id="datestamp"></div>
  </div>

  <div class="greeting" id="greeting"></div>

  <div class="clock-block">
    <div class="clock" id="clock">--:--:--</div>
    <div class="clock"><small>MELBOURNE · AEST</small></div>
  </div>

  <div class="left-col">
    <div class="panel">
      <h2>Systems / Connectors</h2>
      <div id="systems"></div>
    </div>
  </div>

  <div class="right-col">
    <div class="panel">
      <h2>Content Queue</h2>
      <div id="queue"></div>
    </div>
    <div class="panel">
      <h2>Priority Tasks</h2>
      <div id="tasks"></div>
    </div>
  </div>

  <div class="bottom-bar" id="statbar">
    <button id="briefBtn">◈ Brief Me</button>
  </div>
</div>

<audio id="briefAudio" src="sunil_brief.mp3" preload="none" hidden></audio>

<script>
/* ============ DATA — edit here (stands in for sunil_data.js) ============ */
window.SUNIL_DATA = {
  greeting: "Good morning, sir. All systems are operational.",
  generated: "2026-07-18",
  connectors: [
    {name:"GMAIL",      state:"STANDBY", lamp:"warn"},
    {name:"REVENUECAT", state:"STANDBY", lamp:"warn"},
    {name:"METRICOOL",  state:"STANDBY", lamp:"warn"},
    {name:"META ADS",   state:"OFFLINE", lamp:"off"},
    {name:"BROWSER",    state:"ONLINE",  lamp:"on"},
    {name:"ROUTINES",   state:"ONLINE",  lamp:"on"}
  ],
  content: [
    {when:"MON 09:00", title:"Blog post — shipping log week 29"},
    {when:"TUE 12:30", title:"X thread — MRR milestone recap"},
    {when:"THU 18:00", title:"YouTube short — feature demo"}
  ],
  tasks: [
    "Review overnight support inbox",
    "Approve scheduled posts before 9am",
    "Check ad spend vs. weekly cap"
  ],
  metrics: [
    {label:"MRR",          value:"$4,280", delta:"+3.2%", dir:"up"},
    {label:"Active Subs",  value:"312",    delta:"+9",    dir:"up"},
    {label:"Ad Spend 7d",  value:"$610",   delta:"-4.1%", dir:"down"},
    {label:"Open Tickets", value:"5",      delta:"+2",    dir:"down"}
  ]
};

/* ============ HUD population ============ */
const D = window.SUNIL_DATA;
document.getElementById('greeting').textContent = D.greeting;
document.getElementById('datestamp').textContent =
  new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase();

document.getElementById('systems').innerHTML = D.connectors.map(c =>
  `<div class="sysrow"><span><span class="lamp ${c.lamp}"></span>${c.name}</span><span class="state">${c.state}</span></div>`).join('');

document.getElementById('queue').innerHTML = D.content.map(c =>
  `<div class="queue-item"><span class="when">${c.when}</span>${c.title}</div>`).join('');

document.getElementById('tasks').innerHTML = D.tasks.map(t =>
  `<div class="queue-item">▸ ${t}</div>`).join('');

const bar = document.getElementById('statbar');
const btn = document.getElementById('briefBtn');
D.metrics.forEach(m=>{
  const el = document.createElement('div');
  el.className = 'stat';
  el.innerHTML = `<div class="val">${m.value}</div><div class="lbl">${m.label}</div>
    <div class="delta ${m.dir}">${m.dir==='up'?'▲':'▼'} ${m.delta}</div>`;
  bar.insertBefore(el, btn);
});

function tick(){
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-AU',{hour12:false,timeZone:'Australia/Melbourne'});
}
tick(); setInterval(tick,1000);

/* ============ BRIEF ME — mp3 if present, else spoken synthesis ============ */
let speaking = false;
const audio = document.getElementById('briefAudio');

function setSpeaking(on){
  speaking = on;
  btn.classList.toggle('speaking', on);
  btn.innerHTML = on ? '◈ Speaking…' : '◈ Brief Me';
}
btn.addEventListener('click', ()=>{
  if (speaking){
    audio.pause(); audio.currentTime = 0;
    if (window.speechSynthesis) speechSynthesis.cancel();
    setSpeaking(false); return;
  }
  audio.play().then(()=> setSpeaking(true)).catch(()=>{
    // No sunil_brief.mp3 alongside the file — fall back to speech synthesis
    if (!window.speechSynthesis){ setSpeaking(false); return; }
    const lines = [D.greeting,
      `You have ${D.content.length} pieces of content scheduled and ${D.tasks.length} priority tasks.`,
      `Monthly recurring revenue stands at ${D.metrics[0].value}.`,
      "Shall I proceed with the morning agenda?"];
    const u = new SpeechSynthesisUtterance(lines.join(' '));
    const voices = speechSynthesis.getVoices();
    u.voice = voices.find(v=>/en[-_]GB/i.test(v.lang) && /male|daniel|arthur/i.test(v.name))
           || voices.find(v=>/en[-_]GB/i.test(v.lang)) || null;
    u.rate = .95; u.pitch = .85;
    u.onend = ()=> setSpeaking(false);
    setSpeaking(true);
    speechSynthesis.speak(u);
  });
});
audio.addEventListener('ended', ()=> setSpeaking(false));

/* ============ Cinematic canvas scene ============ */
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
let W,H,CX,CY,R;

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  CX = W/2; CY = H/2 - 14;
  R = Math.min(W,H)*0.21;
}
window.addEventListener('resize', resize); resize();

/* ~680 points on a fibonacci sphere */
const N = 680, pts = [];
const GA = Math.PI*(3-Math.sqrt(5));
for(let i=0;i<N;i++){
  const y = 1 - (i/(N-1))*2;
  const r = Math.sqrt(1-y*y);
  const th = GA*i;
  pts.push({x:Math.cos(th)*r, y, z:Math.sin(th)*r, tw:Math.random()*Math.PI*2});
}
const TILT = 0.42;                       // tilted axis
const cosT = Math.cos(TILT), sinT = Math.sin(TILT);

let t = 0;
function frame(){
  t += 0.016;
  ctx.clearRect(0,0,W,H);

  const pulse = speaking ? 1 + 0.10*Math.sin(t*9) : 1 + 0.015*Math.sin(t*1.4);
  const rot = t*0.28;                    // slow rotation
  const cosR = Math.cos(rot), sinR = Math.sin(rot);

  /* ambient core glow */
  const g = ctx.createRadialGradient(CX,CY,0,CX,CY,R*2.1);
  g.addColorStop(0, speaking ? 'rgba(34,211,238,.20)' : 'rgba(34,211,238,.12)');
  g.addColorStop(1,'rgba(34,211,238,0)');
  ctx.fillStyle = g;
  ctx.fillRect(CX-R*2.2,CY-R*2.2,R*4.4,R*4.4);

  /* three concentric dashed HUD arcs, rotating at different speeds */
  const arcs = [
    {r:R*1.55, w:1.4, dash:[3,9],  spd:.22,  a:.5},
    {r:R*1.78, w:1.0, dash:[16,10],spd:-.13, a:.35},
    {r:R*2.02, w:.8,  dash:[2,5],  spd:.07,  a:.25}
  ];
  arcs.forEach(a=>{
    ctx.save();
    ctx.translate(CX,CY); ctx.rotate(t*a.spd);
    ctx.beginPath(); ctx.setLineDash(a.dash);
    ctx.arc(0,0,a.r,0,Math.PI*2);
    ctx.strokeStyle = `rgba(34,211,238,${a.a})`;
    ctx.lineWidth = a.w; ctx.stroke();
    ctx.restore();
  });
  ctx.setLineDash([]);

  /* point sphere */
  const drawn = [];
  for(const p of pts){
    let x = p.x*cosR + p.z*sinR;
    let z = -p.x*sinR + p.z*cosR;
    let y = p.y;
    const y2 = y*cosT - z*sinT;          // apply axis tilt
    const z2 = y*sinT + z*cosT;
    const persp = 1/(1 - z2*0.28);
    drawn.push({sx:CX + x*R*pulse*persp, sy:CY + y2*R*pulse*persp, z:z2, tw:p.tw});
  }
  drawn.sort((a,b)=>a.z-b.z);
  for(const d of drawn){
    const front = (d.z+1)/2;
    const tw = 0.75 + 0.25*Math.sin(t*2 + d.tw);
    const alpha = (0.10 + front*0.75)*tw;
    const size = 0.7 + front*1.5;
    ctx.beginPath();
    ctx.fillStyle = `rgba(103,232,249,${alpha})`;
    if (front > .82){ ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 7; }
    ctx.arc(d.sx,d.sy,size,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  /* tilted elliptical orbital ring with a glowing marker */
  ctx.save();
  ctx.translate(CX,CY); ctx.rotate(-0.30);
  ctx.beginPath();
  ctx.ellipse(0,0,R*1.34,R*0.44,0,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(34,211,238,.4)'; ctx.lineWidth = 1; ctx.stroke();
  const oa = t*0.9;
  const mx = Math.cos(oa)*R*1.34, my = Math.sin(oa)*R*0.44;
  ctx.beginPath();
  ctx.fillStyle = '#a5f3fc';
  ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 14;
  ctx.arc(mx,my,3.4,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
