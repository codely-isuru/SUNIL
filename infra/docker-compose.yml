# SUNIL V2 — Phase 0 development platform
# =========================================================================
# Three infrastructure services only. There is deliberately NO app/api/web
# container here: branch `V2` is a clean-slate rebuild and no application
# code exists yet (ADR-030 Amendment 1). This stack must boot green on its
# own; the app container plugs in at the marked stub below when Stream B/D
# land the rebuilt gateway.
#
# Invocation (always from the repo root, always with an explicit env file so
# that ${...} interpolation resolves against the ROOT .env rather than
# infra/.env, which is what Compose would otherwise look for):
#
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
#
# Or just use scripts/dev-up.ps1 / scripts/dev-up.sh, which do that for you.
#
# Variable convention in this file:
#   ${VAR:-default}   non-secret config (ports, names, tuning) — safe defaults
#                     so that `docker compose config` validates with no .env.
#   ${VAR:?message}   secrets (passwords, keys) — MANDATORY. Compose refuses to
#                     resolve the file at all if the value is unset or empty.
#
# The `:?` form replaced a bare `${VAR}` after the Phase 0 security review:
# "unset resolves to empty, the container then fails loudly" was FALSE for at
# least one service — an empty N8N_ENCRYPTION_KEY makes n8n silently generate
# its own key, so the vault holding every tool credential ends up encrypted
# under a key nobody manages. Fail-closed at interpolation time instead.
# Consequence: `docker compose config` needs an env file. CI passes
# `--env-file .env.example`, and has a step asserting that config WITHOUT one
# fails — i.e. the guard is tested, not assumed.
#
# Ports: every published port is bound to 127.0.0.1 explicitly (ADR-032).
# A bare "5433:5432" publishes on 0.0.0.0 — every interface, including the LAN
# and every Docker/WSL virtual adapter. CI parses the resolved config and
# asserts host_ip == 127.0.0.1 on every entry.
#
# No real credential belongs in this file, ever. See .env.example.
# =========================================================================

name: ${COMPOSE_PROJECT_NAME:-sunil-v2}

services:
  # -----------------------------------------------------------------------
  # Postgres 17 + pgvector — the single stateful service.
  #
  # Image choice: `pgvector/pgvector:0.8.6-pg17`.
  #   Why this one over the alternatives:
  #   - It is the pgvector project's own published image, and it is built ON
  #     TOP of the official `postgres:17` Debian image — so we inherit the
  #     official entrypoint, initdb behaviour, /docker-entrypoint-initdb.d
  #     contract and PGDATA layout unchanged. Nothing about standard Postgres
  #     operation is bespoke here.
  #   - The extension is precompiled and, critically, the tag pins BOTH
  #     versions independently: `0.8.6` (pgvector) and `pg17` (server). An
  #     index built by one pgvector version must be readable by the next, so
  #     pinning the extension version explicitly — not just `pg17` — is what
  #     keeps Stream C's Mem0 embeddings reproducible (ADR-030 §3, ADR-013).
  #   - Rejected: `postgres:17` + compiling pgvector in a custom Dockerfile —
  #     adds a build toolchain, a build step and a maintenance burden for an
  #     artefact upstream already publishes.
  #   - Rejected: `ankane/pgvector` — the author's personal pre-donation
  #     namespace, superseded by the `pgvector/` org images.
  #   Swap cost is one line: any image exposing Postgres 17 with the `vector`
  #   extension available drops in, which keeps ADR-030's "every component is
  #   a replaceable vendor" rule true for the database too.
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: ${COMPOSE_PROJECT_NAME:-sunil-v2}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sunil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sunil}
      # Extra databases created on FIRST boot only, by the init script below.
      # LiteLLM (virtual keys/budgets) and n8n (workflow state) each get their
      # own logical database inside this one server: separate schemas and
      # separate migration histories, one thing to back up.
      SUNIL_LITELLM_DB: ${LITELLM_DB_NAME:-litellm}
      SUNIL_N8N_DB: ${N8N_DB_NAME:-n8n}
      # Least-privilege roles for the two side services (TB9, security review
      # B3). Each owns ONLY its own database and is REVOKEd from `sunil`, so a
      # compromised LiteLLM or n8n container cannot read or write
      # audit_events / approvals. Role names are fixed, not configurable:
      # they appear in the two DATABASE_URL/DB_POSTGRESDB_USER references
      # below and there is no reason to vary them per environment.
      SUNIL_LITELLM_DB_USER: litellm_user
      SUNIL_LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?set in .env}
      SUNIL_N8N_DB_USER: n8n_user
      SUNIL_N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Host 5433, not 5432: port 5432 on this machine is already bound by an
      # unrelated container (strapi-next-starter-db-1). Container-internal
      # port stays 5432, so service-to-service URLs are conventional.
      # 127.0.0.1 explicitly — see the header note on ADR-032.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      # -q keeps the log clean; the user/db flags matter because pg_isready
      # defaults to the root OS user, which does not exist as a role here.
      test: ["CMD-SHELL", "pg_isready -q -U ${POSTGRES_USER:-sunil} -d ${POSTGRES_DB:-sunil}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [sunil]

  # -----------------------------------------------------------------------
  # LiteLLM — model gateway (ADR-030 §2). Provider keys live HERE, not in the
  # application, so the app never holds an upstream credential. Pinned to the
  # `-stable` release lane rather than the weekly `v1.89.x` line: upstream
  # promotes a release to `-stable` only after a soak period, and `.patch.N`
  # carries the fixes made against that soak. Bleeding-edge weeklies have
  # repeatedly shipped breaking config changes, and this is a shared seam that
  # six parallel streams will point at (Stream B, C2 override).
  litellm:
    image: ghcr.io/berriai/litellm:v1.83.14-stable.patch.3
    container_name: ${COMPOSE_PROJECT_NAME:-sunil-v2}-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Upstream provider credentials are delivered ONLY through this file, and
    # this file is mounted into no other service (security review D-finding on
    # the shared .env; ADR-030 §2 promises "the app never holds an upstream
    # credential", which one shared .env quietly broke — every process reading
    # the root .env saw ANTHROPIC_API_KEY).
    #
    #   infra/.env.litellm          gitignored, real values, this container only
    #   infra/.env.litellm.example  committed template
    #
    # `required: false` keeps the file lintable in CI, where the gitignored
    # file cannot exist. That is a deliberate fail-OPEN on presence, and it is
    # safe: a missing file means the proxy starts with no provider key and
    # every completion call fails with an explicit 401 from the upstream. It
    # can never mean "use a weaker credential". scripts/dev-up.* additionally
    # create the file from the template and refuse to boot on dummy values.
    env_file:
      - path: ./.env.litellm
        required: false
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      # NOTE: LITELLM_SALT_KEY, ANTHROPIC_API_KEY and OPENAI_API_KEY are
      # deliberately NOT listed here. `environment:` OVERRIDES `env_file:`, so
      # naming them here with a ${...} interpolation from the shared .env would
      # silently blank out the scoped values above. Do not re-add them.
      #
      # Backing store for virtual keys, per-agent budgets and spend rows —
      # Stream B's exit criterion ("per-agent spend queryable") needs it.
      # Connects as `litellm_user`, which owns ONLY the litellm database and
      # has CONNECT revoked on `sunil` (TB9). Password must be URL-safe —
      # generate with `openssl rand -hex 24`, no punctuation.
      DATABASE_URL: postgresql://litellm_user:${LITELLM_DB_PASSWORD:?set in .env}@postgres:5432/${LITELLM_DB_NAME:-litellm}
      STORE_MODEL_IN_DB: ${LITELLM_STORE_MODEL_IN_DB:-True}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      # 4000 is LiteLLM's own default and is free on this machine.
      # NEVER 4317 — that is the Minions Portal.
      - "127.0.0.1:${LITELLM_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image is Python-based and ships no curl/wget, so probe with the
      # interpreter that is guaranteed present. /health/liveliness answers as
      # soon as the ASGI app is serving and does not call any provider (unlike
      # /health, which fans out to upstreams and would fail with empty keys).
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=4).status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 10
      # Generous: on first boot LiteLLM runs its Prisma schema push against
      # the freshly created database before it starts serving.
      start_period: 120s
    networks: [sunil]

  # -----------------------------------------------------------------------
  # n8n — workflow/scheduler and connector fabric (ADR-030 §5). Pinned to
  # 2.38.5, which is the digest the upstream `stable` tag currently resolves
  # to (verified: sha256:f98bb7c2…). 2.39.1 exists but is the `latest` lane.
  # Licence note: Sustainable Use Licence — internal use only, never resold
  # as a hosted service (ADR-030 Consequences).
  n8n:
    image: n8nio/n8n:2.38.5
    container_name: ${COMPOSE_PROJECT_NAME:-sunil-v2}-n8n
    restart: unless-stopped
    environment:
      # Postgres-backed rather than the default SQLite: workflow state is real
      # state, and Stream E's scheduled triggers must survive a container
      # rebuild.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      # `n8n_user`, not the superuser: owns ONLY the n8n database, CONNECT on
      # `sunil` revoked (TB9). n8n executes user-authored Code nodes, so it is
      # the most likely of the three services to be turned against the DB.
      DB_POSTGRESDB_USER: n8n_user
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set in .env}
      # Encrypts n8n's own credential vault at rest. Losing/changing this key
      # makes every stored credential undecryptable — treat it as a secret and
      # keep it stable across rebuilds. MANDATORY (`:?`): left empty, n8n
      # generates its own key and the vault becomes unmanaged.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      # Must carry the *host* port or webhook URLs shown in the editor are
      # unreachable from the browser.
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5680/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Australia/Melbourne}
      TZ: ${GENERIC_TIMEZONE:-Australia/Melbourne}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      # Silences the 2.x deprecation warning and opts into the current
      # permission model for filesystem access from Code nodes.
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      # Host 5680. Both 5678 AND 5679 are already bound on this machine by a
      # single host-native node process (the local n8n source build in
      # C:\repo\n8n — main port + task-broker port). 5680 is free.
      #
      # 127.0.0.1 matters most here: n8n 2.x shows an unauthenticated owner-
      # setup screen on first boot, so whoever reaches this port first owns
      # the credential vault (security review B2).
      - "127.0.0.1:${N8N_HOST_PORT:-5680}:5678"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Alpine/busybox wget is present in this image; curl is not.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks: [sunil]

  # -----------------------------------------------------------------------
  # STUB — the SUNIL application container plugs in HERE.
  #
  # Intentionally commented out: no application code exists on `V2` yet
  # (ADR-030 Amendment 1), and an app service pointing at an empty build
  # context would make this stack fail to boot, breaking the Phase 0 exit
  # criterion ("Compose stack boots green"). Uncomment and fill in when the
  # rebuilt gateway lands. The seams it needs are already provided above:
  # Postgres+pgvector for memory/entities, LiteLLM as the only egress to
  # model providers, n8n reachable for turn triggers (C5).
  #
  # Variable names below are the frozen ARCHITECTURE_V2 §5 names, not
  # invented ones (QA cross-branch sweep: the first draft used LLM_BASE_URL /
  # N8N_BASE_URL, which exist nowhere in the config inventory — Stream B/D
  # would have wired the real service to keys that are never read).
  # NOTE: every URL here is the IN-NETWORK address (service name +
  # container-internal port). The host-side equivalents (5433/4000/5680) are
  # what a host-native process in .env uses; do not mix the two.
  #
  # api:
  #   build:
  #     context: ..
  #     dockerfile: infra/api/Dockerfile
  #   container_name: ${COMPOSE_PROJECT_NAME:-sunil-v2}-api
  #   restart: unless-stopped
  #   environment:
  #     # user/db default to `sunil`; see POSTGRES_USER / POSTGRES_DB.
  #     DATABASE_URL: postgresql+asyncpg://sunil:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/sunil
  #     SESSION_SECRET: ${SESSION_SECRET:?set in .env}
  #     SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sunil_session}
  #     WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
  #     API_HOST: 0.0.0.0            # inside the container only; the PUBLISHED
  #     API_PORT: 8000               # port is 127.0.0.1-bound below
  #     LOG_LEVEL: ${LOG_LEVEL:-INFO}
  #     SUNIL_CONFIG_DIR: /app/config
  #     SUNIL_TURN_DEADLINE_S: ${SUNIL_TURN_DEADLINE_S:-120}
  #     # C2 provider base-URL override (ADR-017): the router policy does not
  #     # change, only where it sends the call. Rollback = unset this.
  #     SUNIL_LLM_PROVIDER_LANE: ${SUNIL_LLM_PROVIDER_LANE:-gateway}
  #     SUNIL_LLM_GATEWAY_BASE_URL: http://litellm:4000
  #     # A per-agent VIRTUAL key, never LITELLM_MASTER_KEY: the master key is
  #     # the proxy's admin credential (it can mint keys and read all spend).
  #     LITELLM_VIRTUAL_KEY_DEFAULT: ${LITELLM_VIRTUAL_KEY_DEFAULT:?set in .env}
  #     SUNIL_N8N_MCP_BASE_URL: http://n8n:5678/mcp
  #     SUNIL_N8N_MCP_AUTH_TOKEN: ${SUNIL_N8N_MCP_AUTH_TOKEN:?set in .env}
  #     SUNIL_APPROVAL_TTL_HOURS: ${SUNIL_APPROVAL_TTL_HOURS:-72}
  #     SUNIL_APPROVAL_NOTIFY_WEBHOOK_URL: ${SUNIL_APPROVAL_NOTIFY_WEBHOOK_URL:-}
  #     SUNIL_SERVICE_TOKEN: ${SUNIL_SERVICE_TOKEN:?set in .env}
  #     SUNIL_MEMORY_PROVIDER: ${SUNIL_MEMORY_PROVIDER:-mem0}
  #     GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  #     # NO ANTHROPIC_API_KEY / OPENAI_API_KEY here, ever: upstream keys are
  #     # scoped to infra/.env.litellm and the app reaches providers only
  #     # through the gateway (ADR-030 §2).
  #   ports:
  #     - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     litellm:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 30s
  #   networks: [sunil]

volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-sunil-v2}_pgdata
  n8n_data:
    name: ${COMPOSE_PROJECT_NAME:-sunil-v2}_n8n_data

networks:
  # One shared bridge network. Services address each other by service name on
  # their container-internal ports (postgres:5432, litellm:4000, n8n:5678) —
  # host port mappings above are for humans and for the host-native tooling,
  # not for inter-service traffic.
  sunil:
    name: ${COMPOSE_PROJECT_NAME:-sunil-v2}_net
    driver: bridge
