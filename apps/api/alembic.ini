# Alembic configuration for the SUNIL V2 API.
#
# Run from `apps/api`:  alembic upgrade head
#
# There is deliberately NO `sqlalchemy.url` here. The URL comes from
# `Settings.database_url` inside `env.py`, because settings.py is the single env
# seam (ARCHITECTURE_V2 §5) and a second copy of the database URL — in a file
# that would then hold a password in git — is exactly the drift that seam exists
# to prevent.
[alembic]
script_location = sunil/db/alembic
prepend_sys_path = .
# ISO-ish, sortable revision filenames; the history stays a single linear chain
# (ADR-002), so a merge point is a mistake to notice, not a state to support.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
