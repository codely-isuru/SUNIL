# QA fixture config. Prices copied verbatim from ARCHITECTURE_V1.md §4.4's verified
# catalogue (USD per million tokens) so ET-9's cost arithmetic checks a real pinned
# table, not an invented one. `claude-sonnet-5` is the M1 default for both live
# capabilities (§5.3).
version: 1
pricing_version: "2026-08-14"
providers:
  anthropic:
    models:
      claude-sonnet-5:
        context_window: 1000000
        max_output: 128000
        input_usd_per_mtok: 2
        output_usd_per_mtok: 10
        supports_structured_output: true
      claude-opus-5:
        context_window: 1000000
        max_output: 128000
        input_usd_per_mtok: 5
        output_usd_per_mtok: 25
        supports_structured_output: true
capabilities:
  general_reasoning:
    provider: anthropic
    model: claude-sonnet-5
    max_tokens: 1024
    timeout_s: 20
  complex_reasoning:
    provider: anthropic
    model: claude-opus-5
    max_tokens: 1024
    timeout_s: 25
