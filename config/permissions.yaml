---
# The permission matrix: agent x tool x operation -> allow | ask_user | deny.
#
# `apps/api/sunil/core/permissions/engine.py` is the decision function; this
# file is only the data it reads. A missing entry is DENY *structurally* —
# enforced by the engine's control flow, never by anything in this file, so no
# edit here can turn an absent grant into an allow (C1 §2.2).
#
# ADR-034: one MCP **server** is one **tool** here (its `config/tools.yaml`
# key); one MCP **tool** is one **operation** under it. A server advertising a
# new tool does NOT gain a grant — new operations arrive by a reviewed change to
# this file. Server self-description (`readOnlyHint` and friends) never
# participates in the decision.
#
# Startup cross-validates every agent named here against config/agents.yaml and
# every tool/operation against config/tools.yaml, and refuses to boot on a
# mismatch.
version: 1

agents:
  project_manager:
    # Native read-only tool (the M1-proven GitHub tool, ported).
    github:
      list_recent_activity: allow

    # Restored by the w2r3 parcel (ruling R16), 2026-09-16, TOGETHER with the
    # config/tools.yaml block the capture gate verified — R15's atomicity rule:
    # a row here without that block is a startup cross-validation refusal.
    # `issues_close` stays `ask_user` (ARCHITECTURE_V2 §6's worked example: the
    # call parks via C4 and the owner reads "close issue N" before deciding).
    github_mcp:
      issues_list: allow
      issues_close: ask_user

    # MCP over streamable HTTP (the n8n MCP server, Stream E).
    # `post_update` WRITES (it records something outside SUNIL), so it parks via
    # C4 rather than executing on the agent's say-so. There is no `allow` row on
    # this server by design: n8n is the one tool whose own workflows can be
    # edited in a browser, so an unattended grant here would widen with an edit
    # nobody reviews (docs/tasks/S2-E-n8n.md §3).
    #
    # `run_workflow` is gone with the tools.yaml row it needed — see the comment
    # there. A grant for an operation no tool declares fails startup's
    # cross-validation, so this file cannot be left behind on its own.
    n8n_mcp:
      post_update: ask_user

  # Stream F's developer agent (ADR-030 §4, docs/tasks/S2-F-openhands.md §5.1).
  # The agent delegates a work order to the sandboxed OpenHands engine and then
  # expresses the git writes that run wants as ordinary tool calls, decided
  # here like anyone else's.
  #
  # There is deliberately no row for the DELEGATION itself: a sandboxed run that
  # touches nothing outside its own container is not an action on the world, and
  # the chokepoint governs actions on the world. The work order is a NON-tool
  # plan step addressed to the agent.
  # ADR-030 §4 gave the developer TWO rows. The w2r3 parcel restores ONE.
  #
  # `merge_main: ask_user` — the owner decides, every time. Restored 2026-09-16
  # with the verified pin. It is now a bounded composition (open a PR, then merge
  # that PR number), but the governance did not change: one operation, one
  # approval, bound to exactly {project_key, branch, base_branch}. What the owner
  # gains is a server-side reviewable PR trail (R16 part 3).
  #
  # `push_branch: allow` — the one unattended write — is STILL DORMANT, and the
  # parcel deliberately did not restore it (R16 part 4 / parcel step 5). Its
  # executor was ruled toward the ENGINE's own sandbox-scoped token, and the
  # final shape belongs to the engine-enablement ADR, which has not landed. So
  # this parcel adds NO new unattended write. To restore verbatim, with that ADR
  # and the tools.yaml row it needs:
  #     push_branch: allow
  developer:
    github_mcp:
      merge_main: ask_user
