---
# The Tool Registry (ADR-034, C1 §5): every tool and the operations it exposes.
#
# Authority, not inventory: "an MCP tool is callable IFF it appears here with an
# explicit `operations:` entry ... AND has a permission row" (C1 §5). A server
# that advertises a tool absent from this file does not exist to SUNIL — the
# adapter logs it at startup and ignores it. Server self-description
# (`readOnlyHint`, `inputSchema`) never overrides anything below.
#
# `read_only` and `timeout_s` are SUNIL's values. `params_ref` points at the
# Pydantic model SUNIL validates with (C1 step 2, `extra="forbid"` enforced by
# the loader) — never a schema fetched from the server.
#
# NO SECRET VALUES LIVE HERE. `credential_env:` and the `*_env` fields are
# environment-variable NAMES; each maps to the lowercased `SecretStr` field of
# the same name on `Settings` and is injected into the child's minimal
# environment at spawn (C1 §5). A name with no matching field, or an unset
# value, fails adapter startup.
version: 1

tools:
  # ---------------------------------------------------------------- native ---
  github:
    kind: native
    display_name: GitHub (native, read-only)
    # M1's proven tool, ported. owner/repo come from config/projects.yaml via
    # the wiring code, NEVER from the plan: the only parameter is project_key.
    operations:
      list_recent_activity:
        read_only: true
        timeout_s: 15
        params_ref: sunil.tools.github.adapter:GitHubListRecentActivityParams

  # ------------------------------------------------------------- mcp_stdio ---
  # github_mcp — RE-LANDED by the w2r3 parcel (ruling R16), 2026-09-16, after
  # the capture gate passed. It was DORMANT since 2026-09-12 because the old pin
  # (npx @modelcontextprotocol/server-github@0.6.2) is upstream-deprecated and
  # advertised NONE of SUNIL's operation names.
  #
  # THE CAPTURE (R16 part 2's gate; verbatim in docs/tasks/S3-github.md §0 and
  # pinned byte-for-byte by apps/api/tests/unit/github_mcp/): the official
  # github/github-mcp-server v1.12.2 was booted on Docker stdio with a scoped
  # token, answered MCP 2025-06-18, and advertised 45 tools — including
  # list_issues, issue_write, create_pull_request and merge_pull_request.
  #
  # ONE of R16's four expected bindings was FALSIFIED and corrected here:
  # `update_issue` does not exist on v1.12.2 (issue create/update were merged
  # into `issue_write`). That correction is the naming law working as designed —
  # SUNIL's operation is still `issues_close`, so the permission row, the
  # approval card and the audit history did not move; only the binding did.
  github_mcp:
    kind: mcp_stdio
    display_name: GitHub MCP server
    # Digest-pinned, not tag-pinned: `:latest` would let a silent image swap
    # change what SUNIL's names are bound to between two boots, which is exactly
    # the drift ADR-034 pins versions to make visible.
    command: [docker, run, "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
              "ghcr.io/github/github-mcp-server@sha256:508a0857ec762b1ab1cece29193345b501fab1dd9d1228a7b617062954cecac6",
              stdio]
    version: v1.12.2
    credential_env: ["GITHUB_TOKEN"]
    # The server reads GITHUB_PERSONAL_ACCESS_TOKEN; SUNIL's grantable name —
    # the one condition C-3's allowlist and the Settings field are keyed on —
    # is GITHUB_TOKEN. A RENAME, never a grant: the allowlist is checked on the
    # left-hand name (ADR-034 Amendment 1, tools/mcp/credentials.py).
    credential_env_as: {GITHUB_TOKEN: GITHUB_PERSONAL_ACCESS_TOKEN}
    operations:
      issues_list:
        read_only: true
        timeout_s: 30
        server_tool: list_issues     # confirmed at capture
        params_ref: sunil.tools.mcp.params:IssuesListParams
      issues_close:
        read_only: false
        timeout_s: 30
        # R16 expected `update_issue`; the capture found `issue_write`.
        server_tool: issue_write
        # Adapter-supplied constants a plan cannot reach. They may not collide
        # with a params_model field — the loader refuses that — because the
        # args_hash an approval binds to is computed over the model, and the
        # card says "close issue N".
        fixed_arguments: {method: update, state: closed}
        params_ref: sunil.tools.mcp.params:IssuesCloseParams
      merge_main:
        read_only: false
        timeout_s: 30
        # R16 part 3's bounded composition. The capture settled that it is the
        # ONLY shape: of 45 advertised tools not one merges a branch into a
        # branch. ONE governed operation, ONE approval over
        # {project_key, branch, base_branch}; the PR number is derived state
        # minted inside the approved execution. BOTH tools are drift-checked.
        server_tool: [create_pull_request, merge_pull_request]
        composition: merge_via_pull_request
        params_ref: sunil.tools.mcp.params:MergeMainParams
  #
  # push_branch STAYS DORMANT — R16 part 4 and parcel step 5, verbatim: "if that
  # ADR has not landed, push_branch stays dormant and the parcel lands the other
  # three operations without it; the parcel must not invent the push executor."
  # The engine-enablement ADR (push authority + runtime isolation, one decision
  # about one credential) has not landed. The capture confirms R16's finding on
  # the new server too: `push_files` is an API content-commit, not a branch
  # push, and the commits being pushed exist only in the OpenHands sandbox.
  # sunil.tools.mcp.params:PushBranchParams stays in the tree (the
  # RunWorkflowParams precedent, R15). To restore, verbatim, WITH that ADR:
  #     push_branch:
  #       read_only: false
  #       timeout_s: 30
  #       params_ref: sunil.tools.mcp.params:PushBranchParams
  #   plus config/permissions.yaml: developer.github_mcp.push_branch: allow

  # -------------------------------------------------------------- mcp_http ---
  n8n_mcp:
    kind: mcp_http
    display_name: n8n MCP server
    # Settings FIELD NAMES, not URLs or tokens: the base URL passes the ADR-033
    # loopback-or-named-host validator on Settings, and the token stays a
    # SecretStr until it becomes an Authorization header (TB5).
    base_url_env: SUNIL_N8N_MCP_BASE_URL
    auth_token_env: SUNIL_N8N_MCP_AUTH_TOKEN
    #
    # `run_workflow` USED TO BE DECLARED HERE AND IS DELIBERATELY GONE (Stream
    # E). Two reasons, both found by running the real adapter against the real
    # server:
    #   1. Nothing implemented it. A configured operation the live server does
    #      not advertise fails the ADR-034 drift check, and that failure is not
    #      local to the operation — `start()` refuses, so the ENTIRE n8n tool
    #      leaves the registry. One aspirational row took the whole server down.
    #   2. It was the wrong shape for a governed surface. "Run workflow X with
    #      payload Y" is a meta-tool: its blast radius is every workflow n8n
    #      holds, including the scheduled ones that hold SUNIL's service token,
    #      and an approval card for it reads "run something". Named actions —
    #      `post_update` below — are what an owner can actually consent to.
    # Re-adding one is a two-step change in this order: publish the tool on the
    # MCP Server Trigger workflow FIRST, then add the row here plus a permission
    # row. `sunil.tools.mcp.params:RunWorkflowParams` is still in the tree for
    # whoever does that.
    operations:
      post_update:
        # Stream E's governed action, served by the MCP Server Trigger workflow
        # in infra/n8n/workflows/mcp-server.json. `read_only: false` is OUR
        # statement about it — it records an update against a project — and the
        # startup drift check (ADR-034) requires the live server to advertise a
        # tool of exactly this name before the adapter will start.
        read_only: false
        timeout_s: 30
        params_ref: sunil.tools.mcp.params:PostUpdateParams
