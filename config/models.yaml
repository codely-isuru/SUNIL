# The model catalogue and capability map the Model Router (T6) reads
# (ARCHITECTURE_V1.md §4.4, §4.5).
#
# `models` is the pinned price/context table verified against the live
# Anthropic documentation on 2026-08-14 (§4.4) — model ids are pinned
# snapshots, not evergreen pointers. `pricing_version` is stamped onto
# every `llm_calls` row at the time of the call so a future price edit here
# never silently rewrites the cost of a historical call (§4.4, §13.1).
#
# `capabilities` is the `capability -> {provider, model, max_tokens,
# timeout_s}` lookup an agent's `preferred_capability` /
# `escalation_capability` (config/agents.yaml) and the orchestrator's own
# plan-generation call resolve against (§4.5).
#
# T24 (2026-08-17): `general_reasoning` now resolves to `openai` /
# `gpt-5.1-2025-11-13` — the owner has an OpenAI key and no Anthropic key
# yet (docs/SECRETS_SETUP.md §0), so the M1 hot path needs a provider
# whose key actually exists. `general_reasoning_anthropic` below carries
# the exact shape `general_reasoning` used before this change
# (`claude-sonnet-5`) so that adding the Anthropic key later is a config
# edit (repoint `general_reasoning` back, or point `config/agents.yaml` /
# `core/orchestrator/turn.py`'s `_PLAN_CAPABILITY` at
# `general_reasoning_anthropic` instead), never a code change (ADR-016).
# `complex_reasoning` is wired to Opus 5 for M6's escalation path and is
# not on the M1 hot path either way.
version: 1
pricing_version: "2026-08-14"

models:
  claude-opus-5:
    provider: anthropic
    context_window: 1000000
    max_output: 128000
    input_usd_per_mtok: "5"
    output_usd_per_mtok: "25"
    supports_structured_output: true

  claude-sonnet-5:
    provider: anthropic
    context_window: 1000000
    max_output: 128000
    input_usd_per_mtok: "2"
    output_usd_per_mtok: "10"
    supports_structured_output: true

  claude-fable-5:
    provider: anthropic
    context_window: 1000000
    max_output: 128000
    input_usd_per_mtok: "10"
    output_usd_per_mtok: "50"
    supports_structured_output: true

  claude-haiku-4-5-20251001:
    provider: anthropic
    context_window: 200000
    max_output: 64000
    input_usd_per_mtok: "1"
    output_usd_per_mtok: "5"
    supports_structured_output: true

  # T23 (2026-08-17) — the second registered provider (ADR-003 §4.6);
  # T24 (2026-08-17) repointed `general_reasoning` here, so this is now
  # the M1 hot-path model. The model id itself IS verified:
  # `gpt-5.1-2025-11-13` is a real, pinned entry read directly from the
  # installed `openai==3.1.0` SDK's own
  # `openai.types.shared.chat_model.ChatModel` Literal, not invented.
  # `supports_structured_output: true` is also verified — the SDK exposes
  # `response_format={"type": "json_schema", ...}` with a `strict` flag
  # (see `sunil/providers/openai.py`'s module docstring for the caveat:
  # the conformance guarantee is opt-in and a narrower schema subset than
  # Anthropic's, not unconditional constrained decoding).
  #
  # ****PLACEHOLDER — NOT VERIFIED****: context_window, max_output and
  # both per-token prices below are NOT sourced from anything checkable in
  # this environment (the SDK ships no such static metadata, and there is
  # no network access here to a pricing page). Zero is used for both
  # prices deliberately, so an unverified number can never be mistaken for
  # a real one and silently misreported as a cost (reported to the DM —
  # T23 report — rather than guessed). Replace all four values, and this
  # comment, the day they are confirmed against the real OpenAI pricing
  # page, the same way `pricing_version` above records when the Anthropic
  # numbers were checked.
  gpt-5.1-2025-11-13:
    provider: openai
    context_window: 0
    max_output: 0
    input_usd_per_mtok: "0"
    output_usd_per_mtok: "0"
    supports_structured_output: true

capabilities:
  # Used by both the orchestrator's plan-generation call (purpose=plan) and
  # the Project Manager agent's analysis call (purpose=analysis) — M1's
  # nominal-path model for both (§5.1, §5.3).
  #
  # T24 (2026-08-17): repointed from anthropic/claude-sonnet-5 to
  # openai/gpt-5.1-2025-11-13 — the owner has an OpenAI key, no Anthropic
  # key yet. This is the real test of ADR-003's §4.6 claim: the hot path
  # now runs through the second provider with zero changes to
  # core/orchestrator, core/agent_framework, agents/* or tools/* — only
  # this file and config/agents.yaml's *values* would ever need to move,
  # and config/agents.yaml did not even need that (it names the
  # capability, not the provider). This was made strict-schema-safe for
  # OpenAI first — see core/orchestrator/plan_schema.py's T24 note
  # (every property, including steps[].tool, is now in `required`).
  general_reasoning:
    provider: openai
    model: gpt-5.1-2025-11-13
    max_tokens: 1024
    timeout_s: 20

  # M6's escalation capability (ARCHITECTURE_V1.md §4.5). No M1 agent logic
  # requests it yet; defined now so escalation is additive later.
  complex_reasoning:
    provider: anthropic
    model: claude-opus-5
    max_tokens: 2048
    timeout_s: 25

  # T24: the exact shape `general_reasoning` had before this change —
  # kept so adding the owner's Anthropic key later is a config edit
  # (repoint `general_reasoning` back to this shape, or point
  # `config/agents.yaml`/`turn.py`'s `_PLAN_CAPABILITY` at this name
  # instead), never a code change (ADR-016).
  general_reasoning_anthropic:
    provider: anthropic
    model: claude-sonnet-5
    max_tokens: 1024
    timeout_s: 20
